<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Brskt Space mark (same planet as Brand.astro): violet planet, mint ring passing in front, sun-colored moon. -->
  <defs>
    <radialGradient id="g" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#b39dff"/>
      <stop offset="1" stop-color="#4900c7"/>
    </radialGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="80%">
      <stop offset="0" stop-color="#2a1660"/>
      <stop offset="1" stop-color="#0b0814"/>
    </radialGradient>
    <clipPath id="front"><rect x="-4" y="16" width="40" height="20"/></clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>
  <circle cx="6" cy="7" r="0.9" fill="#ece9f5" opacity=".7"/>
  <circle cx="26.5" cy="25.5" r="0.8" fill="#ece9f5" opacity=".55"/>
  <circle cx="24.5" cy="6.5" r="2" fill="#fde68a"/>
  <g transform="rotate(-22 16 16)">
    <ellipse cx="16" cy="16" rx="13" ry="4.2" fill="none" stroke="#5eead4" stroke-width="2.2" opacity=".55"/>
  </g>
  <circle cx="16" cy="16" r="8" fill="url(#g)"/>
  <g transform="rotate(-22 16 16)">
    <ellipse cx="16" cy="16" rx="13" ry="4.2" fill="none" stroke="#5eead4" stroke-width="2.2" clip-path="url(#front)"/>
  </g>
</svg>
